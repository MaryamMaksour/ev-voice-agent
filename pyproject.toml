[project]
name = "voice-agent"
version = "0.1.0"
description = "Self-hosted AI voice agent that checks leads and updates the CRM"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,silero,turn-detector]~=1.8",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
loadtest = ["livekit-api>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent", "crm", "evals", "loadtest"]
