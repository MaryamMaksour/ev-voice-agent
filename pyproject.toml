[project]
name = "voice-agent"
version = "0.1.0"
description = "Self-hosted AI voice agent (LiveKit + vLLM, Ollama for testing) that checks leads and updates the CRM"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,silero,turn-detector]~=1.8",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Windows has no system time-zone database; zoneinfo needs this package there
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.110", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# talk to the agent by voice from a terminal (python -m agent.talk)
talk = ["livekit>=1.0", "livekit-api>=1.0", "sounddevice>=0.4"]
loadtest = ["livekit-api>=1.0"]
# the demo website (python -m demo.server)
demo = ["fastapi>=0.110", "uvicorn>=0.30", "livekit-api>=1.0"]
# run the speech-to-text server natively (no Docker): Parakeet on CPU
stt = ["sherpa-onnx>=1.12", "numpy", "fastapi>=0.110", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
stt-whisper = ["faster-whisper>=1.1", "fastapi>=0.110", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent", "crm", "evals", "loadtest", "demo"]

[tool.setuptools.package-data]
demo = ["options.json", "static/*"]
