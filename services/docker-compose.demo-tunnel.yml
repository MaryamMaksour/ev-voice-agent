# Server option: reach the demo website's calls through an SSH tunnel.
#
# Turn it on with one line in .env:   DEMO_TUNNEL=1
# deploy/deploy.sh then adds this file on top of docker-compose.yml.
#
# Why: the browser's call audio goes straight to the address LiveKit advertises. Over an SSH tunnel the
# browser can only reach the server as 127.0.0.1, so LiveKit must advertise that address, and the audio
# travels over TCP port 7881 (forwarded by the tunnel). Open the tunnel with all three ports:
#   ssh -L 8090:localhost:8090 -L 7880:localhost:7880 -L 7881:localhost:7881 <user>@<server>
# While this is on, callers that are not on the server itself (3CX phones) cannot connect to LiveKit's audio,
# so remove DEMO_TUNNEL from .env (or set it to 0) for real calls.

services:
  livekit:
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
