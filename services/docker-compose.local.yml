# Laptop-only stack, no GPU: LiveKit + Redis + STT (Parakeet, CPU) + TTS (Kokoro, CPU) on the laptop,
# the LLM is the vLLM server on the company GPU server (LLM_BASE_URL=http://<server-ip>:8000/v1).
#   docker compose -f services/docker-compose.local.yml --env-file .env up -d
#   python -m agent.main dev            # the agent, on the laptop
#   python -m agent.talk --lead L003    # call it
# The normal setup is everything on the GPU server: services/docker-compose.yml.

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
      args:
        BASE: python:3.11-slim
    environment:
      # Parakeet: accurate English STT that is fast on a plain CPU.
      # For Whisper instead: STT_ENGINE=whisper, WHISPER_MODEL=small.en, WHISPER_DEVICE=cpu
      STT_ENGINE: ${LOCAL_STT_ENGINE:-parakeet}
      PARAKEET_DIR: /root/.cache/huggingface/parakeet
      PARAKEET_THREADS: ${PARAKEET_THREADS:-4}
      WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-small.en}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      STT_MAX_PARALLEL: "1"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:8001"

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.2
    ports:
      - "8880:8880"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  hf-cache:
