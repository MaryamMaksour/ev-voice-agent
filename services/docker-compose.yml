# Company GPU server: the whole voice stack in one compose file.
#
#   cp .env.example .env                       # fill in LIVEKIT keys, HF_TOKEN if needed
#   mkdir -p data/recordings logs && chmod 777 data/recordings
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose -f services/docker-compose.yml --env-file .env up -d --build
#   docker compose -f services/docker-compose.yml --env-file .env logs -f vllm   # first start downloads the model
#   python -m agent.check                      # every service OK?
#
# Then, from a laptop on the same network:  python -m agent.talk --lead L003
#
# Host networking keeps WebRTC simple and lets services reach each other on localhost.
# Ports on the server: 7880 (LiveKit API/websocket), 7881/tcp + 7882/udp (call audio),
# 8000 (vLLM), 8001 (STT), 8880 (TTS), 6379 (Redis). Only 7880-7882 need to be reachable
# from callers; keep the rest on the server.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-logs: &logs
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "10"}

services:
  # --- media server: rooms, WebRTC, (later) SIP for 3CX ----------------------------------
  livekit:
    <<: *logs
    image: livekit/livekit-server:v1.13.7
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Redis: LiveKit <-> Egress messages, and the Celery queue for post-call work
  redis:
    <<: *logs
    image: redis:7.4-alpine
    network_mode: host      # :6379, bound to localhost only
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Egress: records both sides of every call to data/recordings/<room>.ogg
  egress:
    <<: *logs
    image: livekit/egress:v1.14.1
    network_mode: host
    cap_add: [SYS_ADMIN]    # the recorder's sandbox needs it
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        log_level: info
    volumes:
      - ../data/recordings:/out
    depends_on:
      redis: {condition: service_healthy}
      livekit: {condition: service_started}
    restart: unless-stopped

  # --- models ------------------------------------------------------------------------------
  # LLM: Qwen3.5-9B on vLLM (OpenAI-compatible API on :8000).
  #  --language-model-only     text only: skips the vision encoder, more memory for calls
  #  --reasoning-parser qwen3  any thinking text is split out of the reply (the agent also turns
  #                            thinking off per request with chat_template_kwargs)
  #  --tool-call-parser qwen3_coder + --enable-auto-tool-choice   tool calls (CRM updates)
  #  --enable-prefix-caching   the long system prompt is computed once, not every turn
  # VLLM_GPU_UTIL is the share of GPU memory vLLM takes; the rest is for STT and TTS.
  # A 24 GB GPU: set VLLM_QUANTIZATION=fp8 and VLLM_GPU_UTIL=0.6.
  vllm:
    <<: [*gpu, *logs]
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.27.1}
    network_mode: host
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${LLM_API_KEY:-}
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3.5-9B}
      --served-model-name ${LLM_MODEL:-qwen3.5-9b}
      --host 0.0.0.0 --port 8000
      --language-model-only
      --reasoning-parser qwen3
      --enable-auto-tool-choice --tool-call-parser qwen3_coder
      --enable-prefix-caching
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-48}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.55}
      ${VLLM_EXTRA_ARGS:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 80        # first start downloads ~19 GB
    restart: unless-stopped

  # STT: faster-whisper on the GPU (OpenAI /v1/audio/transcriptions on :8001)
  stt:
    <<: [*gpu, *logs]
    build:
      context: .
      dockerfile: Dockerfile.stt
    network_mode: host
    environment:
      STT_ENGINE: ${STT_ENGINE:-whisper}
      PARAKEET_DIR: /root/.cache/huggingface/parakeet
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MAX_PARALLEL: ${WHISPER_MAX_PARALLEL:-8}
      WHISPER_PROMPT: ${WHISPER_PROMPT:-}
      LOGS_DIR: /logs
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ../logs:/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # TTS: Kokoro (OpenAI /v1/audio/speech on :8880)
  tts:
    <<: [*gpu, *logs]
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.8.2
    network_mode: host
    restart: unless-stopped

  # --- the agent and its background work ---------------------------------------------------
  # Agent worker: joins each call's room and runs VAD -> STT -> turn detector -> LLM -> TTS
  agent:
    <<: *logs
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-}
    network_mode: host
    env_file: ../.env
    environment: &agent-env
      LIVEKIT_URL: ws://127.0.0.1:7880
      LLM_BASE_URL: http://127.0.0.1:8000/v1
      STT_BASE_URL: http://127.0.0.1:8001/v1
      TTS_BASE_URL: http://127.0.0.1:8880/v1
      REDIS_URL: redis://127.0.0.1:6379/0
      RECORDING_ENABLED: ${RECORDING_ENABLED:-1}
      RECORDING_FILEPATH: /out/{room}.ogg
      RECORDINGS_DIR: /app/data/recordings
      CALLS_DIR: /app/data/calls
      LOGS_DIR: /app/logs
    volumes: &agent-volumes
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      vllm: {condition: service_healthy}
      stt: {condition: service_healthy}
      tts: {condition: service_started}
      livekit: {condition: service_started}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Post-call worker (Celery): extraction, CRM fill-in, summary note, logs and recording per call
  postcall-worker:
    <<: *logs
    build:
      context: ..
      args:
        GIT_SHA: ${GIT_SHA:-}
    network_mode: host
    env_file: ../.env
    environment: *agent-env
    volumes: *agent-volumes
    command: ["celery", "-A", "agent.tasks", "worker", "-Q", "postcall", "-c", "${POSTCALL_CONCURRENCY:-4}",
              "--loglevel", "INFO"]
    depends_on:
      redis: {condition: service_healthy}
      vllm: {condition: service_healthy}
    restart: unless-stopped

volumes:
  hf-cache:
  redis:
